name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # On a normal push this opens or updates the Release PR. When that PR is merged, release_created
  # becomes true and the publish job runs.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
      pull-requests: write # maintain the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run lint && pnpm test && pnpm run check:package
      # npm publish runs the prepare script, which builds dist. Provenance requires a public repo.
      - run: npm publish --provenance --access public
        env:
          # A repo secret rather than an environment-scoped one: this token is a short-lived
          # bootstrap, replaced by OIDC trusted publishing right after the first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # zizmor: ignore[secrets-outside-env]
